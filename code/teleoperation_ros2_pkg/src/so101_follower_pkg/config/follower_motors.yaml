so101_follower_node:
  ros__parameters:
    serial_port: /dev/ttyACM1
    input_topic: master/joint_states
    write_rate: 30.0
    readback_rate: 15.0
    command_timeout_sec: 0.5
    motor_names:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
      - gripper
    motor_ids: [1, 2, 3, 4, 5, 6]
    motor_model: sts3215
    offsets: [0.064, -0.882, 0.864, 1.0165, 0.003, 0.7925]
    inverts: [false, false, false, false, false, false]
    enable_torque_on_start: true
    disable_torque_on_shutdown: true
    publish_readback: true
    joint_states_topic: follower/joint_states
