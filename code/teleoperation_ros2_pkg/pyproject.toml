[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-ros2-workspace"
version = "0.1.0"
description = "Development and test tooling for the SO101 LeRobot ROS 2 workspace."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
]

[project.optional-dependencies]
hardware = [
  "lerobot[feetech]",
]
sim = [
  "mujoco",
  "youzi-robot",
]
test = [
  "pytest>=6.2",
]

[tool.pytest.ini_options]
minversion = "6.2"
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
py-modules = []
